name: qa-stability

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * 1"

permissions:
  contents: read

jobs:
  offline-soak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deterministic Runtime
        run: python -m pip install -e ".[dev]"
      - name: Run 5,000 offline deterministic scenarios
        run: python scripts/run_stability_test.py --runs 5000 --report-every 500
      - name: Upload stability evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-stability-report
          path: artifacts/qa/stability_latest.json
          if-no-files-found: error
